<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <!-- Shopping bags -->
  <rect x="30" y="80" width="90" height="110" rx="8" stroke="#1F2937" stroke-width="3" fill="none"/>
  <path d="M50 80 C50 55 110 55 110 80" stroke="#1F2937" stroke-width="3" fill="none"/>
  <rect x="55" y="100" width="12" height="18" rx="2" fill="#1F2937" opacity="0.3"/>
  <rect x="83" y="100" width="12" height="18" rx="2" fill="#1F2937" opacity="0.3"/>

  <!-- House -->
  <path d="M200 220 L280 150 L360 220" stroke="#1F2937" stroke-width="3" fill="none"/>
  <rect x="215" y="220" width="130" height="100" stroke="#1F2937" stroke-width="3" fill="none"/>
  <rect x="265" y="270" width="30" height="50" stroke="#1F2937" stroke-width="2" fill="none"/>
  <rect x="230" y="240" width="30" height="28" stroke="#1F2937" stroke-width="2" fill="none"/>
  <rect x="300" y="240" width="30" height="28" stroke="#1F2937" stroke-width="2" fill="none"/>
  <line x1="280" y1="150" x2="280" y2="130" stroke="#1F2937" stroke-width="2"/>

  <!-- Tag / Price tag -->
  <path d="M450 60 L530 60 L530 130 L490 160 L450 130 Z" stroke="#1F2937" stroke-width="3" fill="none"/>
  <circle cx="470" cy="82" r="8" stroke="#1F2937" stroke-width="2.5" fill="none"/>
  <line x1="480" y1="100" x2="520" y2="100" stroke="#1F2937" stroke-width="2" opacity="0.5"/>
  <line x1="480" y1="112" x2="515" y2="112" stroke="#1F2937" stroke-width="2" opacity="0.5"/>

  <!-- Car outline -->
  <rect x="60" y="330" width="180" height="80" rx="14" stroke="#1F2937" stroke-width="3" fill="none"/>
  <path d="M90 330 L110 290 L200 290 L220 330" stroke="#1F2937" stroke-width="3" fill="none"/>
  <circle cx="100" cy="414" r="20" stroke="#1F2937" stroke-width="3" fill="none"/>
  <circle cx="220" cy="414" r="20" stroke="#1F2937" stroke-width="3" fill="none"/>
  <line x1="80" y1="355" x2="240" y2="355" stroke="#1F2937" stroke-width="1.5" opacity="0.4"/>

  <!-- Phone / mobile -->
  <rect x="380" y="290" width="70" height="120" rx="10" stroke="#1F2937" stroke-width="3" fill="none"/>
  <line x1="395" y1="310" x2="435" y2="310" stroke="#1F2937" stroke-width="2" opacity="0.4"/>
  <line x1="395" y1="325" x2="435" y2="325" stroke="#1F2937" stroke-width="2" opacity="0.4"/>
  <line x1="395" y1="340" x2="435" y2="340" stroke="#1F2937" stroke-width="2" opacity="0.4"/>
  <circle cx="415" cy="385" r="8" stroke="#1F2937" stroke-width="2" fill="none"/>

  <!-- Star -->
  <path d="M510 280 L520 308 L550 308 L526 325 L535 353 L510 336 L485 353 L494 325 L470 308 L500 308 Z"
        stroke="#1F2937" stroke-width="2.5" fill="none"/>

  <!-- Small shopping cart -->
  <path d="M10 10 L30 10 L45 55 L100 55 L110 30 L35 30" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <circle cx="55" cy="68" r="8" stroke="#1F2937" stroke-width="2" fill="none"/>
  <circle cx="90" cy="68" r="8" stroke="#1F2937" stroke-width="2" fill="none"/>

  <!-- Magnifying glass -->
  <circle cx="545" cy="170" r="35" stroke="#1F2937" stroke-width="3" fill="none"/>
  <line x1="570" y1="198" x2="595" y2="225" stroke="#1F2937" stroke-width="4" stroke-linecap="round"/>

  <!-- Ad / listing card icons -->
  <rect x="155" y="60" width="80" height="60" rx="5" stroke="#1F2937" stroke-width="2" fill="none"/>
  <line x1="165" y1="78" x2="225" y2="78" stroke="#1F2937" stroke-width="1.5" opacity="0.5"/>
  <line x1="165" y1="90" x2="215" y2="90" stroke="#1F2937" stroke-width="1.5" opacity="0.5"/>
  <line x1="165" y1="102" x2="210" y2="102" stroke="#1F2937" stroke-width="1.5" opacity="0.5"/>
</svg>
